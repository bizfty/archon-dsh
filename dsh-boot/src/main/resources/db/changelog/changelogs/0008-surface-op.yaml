# DSH M8 schema 演进：anchon_session_surface（会话表面指令表，docs/design-surface-op.md §4.1）。
# 只建表/约束、不迁移数据；对既有库幂等（preConditions onFail=MARK_RAN，同 0007 约定）。
# 与 JPA 实体 SessionSurfaceEntity 一致（含 UK(session_id,gen) = uk_anchon_surface_session_gen、
# (session_id,range_from,range_to) 索引 = idx_anchon_surface_session_range）。
databaseChangeLog:
  - changeSet:
      id: 0008-01-session-surface
      author: archon
      changes:
        - createTable:
            tableName: anchon_session_surface
            remarks: 会话表面指令（append-only；可见面显式演进，不触碰 fact/消息真相）
            columns:
              - column: { name: id, type: VARCHAR(64), constraints: { nullable: false } }
              - column: { name: session_id, type: VARCHAR(64), constraints: { nullable: false } }
              - column: { name: gen, type: BIGINT, constraints: { nullable: false } }
              - column: { name: op, type: VARCHAR(16), constraints: { nullable: false } }
              - column: { name: range_from, type: BIGINT, constraints: { nullable: false } }
              - column: { name: range_to, type: BIGINT }
              - column: { name: replacement, type: TEXT }
              - column: { name: meta_json, type: TEXT }
              - column: { name: created_at, type: TIMESTAMP WITH TIME ZONE }
            primaryKey:
              columnNames: id
              constraintName: pk_anchon_session_surface
        - addUniqueConstraint:
            constraintName: uk_anchon_surface_session_gen
            tableName: anchon_session_surface
            columnNames: session_id, gen
            remarks: 会话内表面代数唯一（并发/多实例下 gen 单调的兜底第二道防线）
        - createIndex:
            indexName: idx_anchon_surface_session_range
            tableName: anchon_session_surface
            columns:
              - column: { name: session_id }
              - column: { name: range_from }
              - column: { name: range_to }
      rollback:
        - dropTable: { tableName: anchon_session_surface }
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists: { tableName: anchon_session_surface }
