server:
  port: 8080

spring:
  application:
    name: anchon-dsh
  # === 数据源（敏感配置移至 profile 文件）===
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agent}
    username: ${DB_USERNAME:agent}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:20}
      minimum-idle: ${DB_MIN_IDLE:5}
  # === JPA ===
  # ddl-auto 与 Liquibase 配合：Liquibase 管理 dsh 自有表（幂等），
  # Hibernate 不再 create（避免每次重启 drop 重建）；update 仅补齐实体差异。
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # === Liquibase（schema 迁移）===
  # dsh 自有表由 db/changelog/db.changelog-master.yaml 管理；
  # changeset 带 preConditions(MARK_RAN)，对既有库幂等（表已存在则跳过）。
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true

  # === Spring AI — DeepSeek（OpenAI 兼容端点）===
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:sk-placeholder-please-set-env}
      base-url: ${OPENAI_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${OPENAI_MODEL:deepseek-chat}
          temperature: 0.7

# === DSH 应用配置 ===
dsh:
  agent:
    max-steps: 200
    temperature: 0.7
    max-history-messages: 200
    max-parallel-tool-calls: 10
  event-log:
    include-tokens: false
  agents:
    main:
      provider: deepseek
      model: ${DSH_AGENT_MODEL:}
      systemPrompt: ""
    planner:
      provider: deepseek
      model: ${DSH_AGENT_MODEL:}
      systemPrompt: "你是规划 Agent（Planner）。你只做规划、拆解任务与制定步骤，不实现代码、不执行操作。输出清晰可执行的分步计划。"

copilot:
  skills:
    directory: "classpath*:/skills"

# === 版本信息（由 Maven 资源过滤注入 build.timestamp，未替换时使用默认值）===
info:
  app:
    name: ${spring.application.name}
    version: "@project.version@"
    build:
      timestamp: "@build.timestamp@"
    description: DSH — DeepSeek Harness 平台
  env:
    enabled: true
    keys:
      - JAVA_HOME
      - JAVA_VERSION
      - OS_NAME
      - OS_ARCH
      - CPU_CORES
  java:
    enabled: true
  os:
    enabled: true
  git:
    enabled: true
    mode: full

logging:
  level:
    root: INFO
    com.bizfty.anchon.dsh: DEBUG

springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: true

# === Spring Boot Actuator ===
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true
    build:
      enabled: true