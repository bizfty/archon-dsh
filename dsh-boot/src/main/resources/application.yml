server:
  port: 8080

spring:
  application:
    name: anchon-dsh
  # === 数据源（敏感配置移至 profile 文件）===
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agent}
    username: ${DB_USERNAME:agent}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:20}
      minimum-idle: ${DB_MIN_IDLE:5}
  # === JPA ===
  # ddl-auto 与 Liquibase 配合：Liquibase 管理 dsh 自有表（幂等），
  # Hibernate 不再 create（避免每次重启 drop 重建）；update 仅补齐实体差异。
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # === Liquibase（schema 迁移）===
  # dsh 自有表由 db/changelog/db.changelog-master.yaml 管理；
  # changeset 带 preConditions(MARK_RAN)，对既有库幂等（表已存在则跳过）。
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true

  # === Spring AI — DeepSeek（OpenAI 兼容端点）===
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:sk-placeholder-please-set-env}
      base-url: ${OPENAI_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${OPENAI_MODEL:deepseek-chat}
          temperature: 0.7

# === DSH 应用配置 ===
dsh:
  # 在线代码开发（/api/code/*）：
  #   coder 场景默认根（项目 = 该目录下的子目录，使用者在此选择项目）
  #   self  场景默认根（自我完善：直接操作 archon-dsh 源码目录）
  coder:
    root: data/workspace/coder/project
  self:
    root: ${user.dir}
  agent:
    max-steps: 200
    temperature: 0.7
    max-history-messages: 200
    max-parallel-tool-calls: 10
    # 常驻 agent 开关（M4，design-resident-agent.md D8）：true=run/stream/manualCompact 委托
    # per-session ResidentAgent（同会话 FIFO 排队、并发 chat 不报错）；false=直接执行旧路径（灰度回退）
    resident: true
  event-log:
    include-tokens: false
  # === 会话读模型开关（M2-5，design §4.5；实际绑定走 DSH_SESSION_READ_MODEL 环境变量，
  # 此处仅作文档化 —— 本仓库因 harness 环境 dsh.* 前缀污染不用类级 @ConfigurationProperties）===
  # table（默认）= 读投影缓存 anchon_session_message；fact-replay = 从真相 anchon_session_fact
  # 只读重放（仅 M2 §6.4 一致性对照验证用，不承载运行时写侧）。
  session:
    read-model: table
  agents:
    main:
      provider: deepseek
      model: ${DSH_AGENT_MODEL:}
    planner:
      provider: deepseek
      model: ${DSH_AGENT_MODEL:}
      # persona 按约定从 classpath 直接加载 prompt/{agentId}.txt（如 prompt/planner.txt），无需配置

copilot:
  skills:
    directory: "classpath*:/skills"

# === 版本信息（由 Maven 资源过滤注入 build.timestamp，未替换时使用默认值）===
info:
  app:
    name: ${spring.application.name}
    version: "@project.version@"
    build:
      timestamp: "@build.timestamp@"
    description: DSH — DeepSeek Harness 平台
  env:
    enabled: true
    keys:
      - JAVA_HOME
      - JAVA_VERSION
      - OS_NAME
      - OS_ARCH
      - CPU_CORES
  java:
    enabled: true
  os:
    enabled: true
  git:
    enabled: true
    mode: full

logging:
  level:
    root: INFO
    com.bizfty.anchon.dsh: DEBUG

springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: true

# === Spring Boot Actuator ===
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true
    build:
      enabled: true